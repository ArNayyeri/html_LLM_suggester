[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "html-llm-suggester"
version = "1.1.0"
description = "AI-powered web form analyzer, input suggester, and Katalon Studio test recorder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ArNayyeri" }
]
keywords = [
    "katalon",
    "test-automation",
    "llm",
    "form-analyzer",
    "qa",
    "test-generation",
    "chrome-extension"
]
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "openai>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
recorder-server = "recorder_server:app.run"

[tool.hatch.build.targets.wheel]
include = [
    "recorder_server.py",
]
